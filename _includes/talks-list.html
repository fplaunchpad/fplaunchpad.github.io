<style>
.talks-list {
  margin-top: 1.5rem;
}
.talk-card {
  border: 1px solid #e0e0e0;
  border-radius: 5px;
  padding: 1rem 1.25rem;
  margin-bottom: 1rem;
  background: #fff;
}
.talk-card h3 {
  margin: 0 0 0.3rem 0;
  font-size: 1.05rem;
}
.talk-meta {
  font-size: 0.85rem;
  color: #666;
  margin: 0 0 0.6rem 0;
}
.talk-meta .talk-speaker {
  font-weight: 600;
  color: #333;
}
.talk-abstract {
  font-size: 0.92rem;
  color: #444;
  line-height: 1.5;
  margin: 0 0 0.6rem 0;
}
.talk-slides {
  font-size: 0.88rem;
  font-weight: 600;
}
</style>

<div class="talks-list">
  {% for talk in site.data.talks.talks %}
  <div class="talk-card">
    <h3>{{ talk.title }}</h3>
    <p class="talk-meta">
      <span class="talk-speaker">{{ talk.speaker }}</span>
      &middot; {{ talk.date | date: "%-d %B %Y" }}
      &middot; {{ talk.venue }}
    </p>
    <p class="talk-abstract">{{ talk.abstract }}</p>
    {% if talk.slides %}
    <a class="talk-slides" href="{{ talk.slides | relative_url }}" target="_blank">Slides (PDF)</a>
    {% endif %}
  </div>
  {% endfor %}
</div>
