<header class="site-header" role="banner">
  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/logo_without_name.png' | relative_url }}" alt="" width="104" height="46" />
      <span>{{ site.title | escape }}</span>
    </a>
    <nav class="primary-nav" aria-label="Main navigation">
      {%- for path in site.header_pages -%}
        {%- assign nav_page = site.pages | where: 'path', path | first -%}
        {%- if nav_page.title -%}
          <a href="{{ nav_page.url | relative_url }}"{% if page.url == nav_page.url %} aria-current="page"{% endif %}>{{ nav_page.title | escape }}</a>
        {%- endif -%}
      {%- endfor -%}
    </nav>
  </div>
</header>
{%- if site.announcement -%}
<a class="announcement-bar" href="{{ site.announcement.link | relative_url }}">{{ site.announcement.text }} &rarr;</a>
{%- endif -%}
