<ul class="social-media-list">
  {%- if site.twitter_username -%}
  <li><a href="https://x.com/{{ site.twitter_username | cgi_escape | escape }}" title="X (Twitter)" aria-label="X (Twitter)"><svg class="svg-icon" viewBox="0 0 16 16"><use xlink:href="{{ '/assets/minima-social-icons.svg#twitter' | relative_url }}"></use></svg></a></li>
  {%- endif -%}
  {%- if site.linkedin_url -%}
  <li><a href="{{ site.linkedin_url }}" title="LinkedIn" aria-label="LinkedIn"><svg class="svg-icon" viewBox="0 0 16 16"><use xlink:href="{{ '/assets/minima-social-icons.svg#linkedin' | relative_url }}"></use></svg></a></li>
  {%- endif -%}
  {%- if site.youtube_url -%}
  <li><a href="{{ site.youtube_url }}" title="YouTube" aria-label="YouTube"><svg class="svg-icon" viewBox="0 0 16 16"><use xlink:href="{{ '/assets/minima-social-icons.svg#youtube' | relative_url }}"></use></svg></a></li>
  {%- endif -%}
  {%- if site.github_url -%}
  <li><a href="{{ site.github_url }}" title="GitHub" aria-label="GitHub"><svg class="svg-icon" viewBox="0 0 16 16"><use xlink:href="{{ '/assets/minima-social-icons.svg#github' | relative_url }}"></use></svg></a></li>
  {%- endif -%}
  {%- if site.zulip_url -%}
  <li><a href="{{ site.zulip_url }}" title="Zulip" aria-label="Zulip"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M22.767 3.589c0 1.209-.543 2.283-1.37 2.934l-8.034 7.174c-.149.128-.343-.078-.235-.25l2.946-5.9c.083-.165-.024-.368-.194-.368H4.452c-1.77 0-3.219-1.615-3.219-3.59C1.233 1.616 2.682 0 4.452 0h15.096c1.77-.001 3.219 1.614 3.219 3.589zM4.452 24h15.096c1.77 0 3.219-1.616 3.219-3.59 0-1.974-1.449-3.59-3.219-3.59H8.12c-.17 0-.277-.202-.194-.367l2.946-5.9c.108-.172-.086-.378-.235-.25l-8.033 7.173c-.828.65-1.37 1.725-1.37 2.934 0 1.974 1.448 3.59 3.218 3.59z"/></svg></a></li>
  {%- endif -%}
  {%- if site.email -%}
  <li><a href="mailto:{{ site.email }}" title="Email" aria-label="Email"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M2 4h20a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm.4 2L12 12.6 21.6 6H2.4zM22 7.9l-10 6.9L2 7.9V18h20V7.9z"/></svg></a></li>
  {%- endif -%}
</ul>
