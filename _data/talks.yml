# Newest first.
talks:
  - title: "Neurosymbolic Planner Synthesis Incorporating Specification Closeness"
    speaker: Pranav Ramesh
    date: 2026-08-12
    venue: SSB 334, IIT Madras
    abstract: >
      In robotics and related applications, specifications used to define objectives, as well as
      safety or liveness constraints, may result in infeasible solutions because of characteristics
      of the underlying controller. The current state of the art places the burden on the developer
      to reassess objectives. In contrast to this cumbersome process, we consider an alternative
      formulation in this project: by translating specifications into a suitable embedding space,
      we can effectively explore a family of close specifications, separated by some epsilon in
      this space, using these as potential alternatives. This idea is broadly related to the notion
      of robustness in learning but framed at the level of logic, rather than observations.
    slides: /assets/talks/pranav-ramesh-neurosymbolic-planner-synthesis.pdf

  - title: "Convergence is Not Correctness: Verifying a Tombstone-free Sequence MRDT in Lean 4"
    speaker: Harisankar B
    date: 2026-07-30
    venue: SSB 334, IIT Madras
    abstract: >
      A collaborative editor cannot describe an edit by the offset where it lands, since a
      concurrent edit moves every offset after it. RGA solves this by naming characters, but keeps
      every deleted character forever as a tombstone, so state grows with the number of edits
      rather than with the size of the document. This talk reports an attempt to remove
      tombstones: a tombstone-free RGA as a Mergeable Replicated Data Type, verified in Lean 4
      using Sal, a port of the F* framework Neem.
    slides: /assets/talks/harisankar-b-tombstone-free-rga.pdf
