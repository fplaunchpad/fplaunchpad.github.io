  - title: "Long Division Has a Proof: Teaching Formal Verification Through School Arithmetic"
    speaker: Anubhav Paul
    designation: Intern, IIT Delhi
    date: 2026-07-14
    venue: Turing Hall, CSE, IIT Madras
    venue_type: internal
    abstract: >
      Formal verification, the practice of proving that a program is correct for every possible
      input, not merely those that have been tested, is widely regarded as specialist work. This
      talk argues that this reputation is largely a teaching problem. Using familiar pen-and-paper
      arithmetic algorithms as case studies, it shows that the central ideas of formal
      verification (specifications, loop invariants, induction, and termination) are already
      latent in these algorithms and emerge naturally once we ask why they work. The accompanying
      open-access book, Learn2Lean, makes this concrete: each chapter implements one algorithm in
      Lean 4, proves it correct, and pairs the proof with step-by-step visualizations and an
      in-browser exercise checker that compiles real Lean code against student submissions.
    repos:
      - name: Learn2Lean
        url: https://github.com/fplaunchpad/Learn2Lean

  - title: "Benchmarking on Modern Hardware"
    speaker: Navaneeth M. Nambiar
    designation: Research Staff
    date: 2026-07-10
    venue: SSB 233, CSE, IIT Madras
    venue_type: internal
    abstract: >
      As technology evolves, attributing performance improvements becomes harder: gains can come
      from code changes, caching, or garbage collection, and it is not always obvious which. This
      talk looks at what to watch out for when benchmarking, with scenarios drawn from real-world
      OCaml optimization work, and lays out ideas, old and new, for a benchmark suite that
      supports cutting-edge research while preserving legacy code performance and production
      stability.
    slides: https://pliss.org/2026/slides/marr2.pdf
    repos:
      - name: retro-httpaf-bench
        url: https://github.com/fplaunchpad/retro-httpaf-bench

